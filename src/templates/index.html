<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能问答系统</title>
    <style>
        :root {
            --bg: #0f1419; --card: #1a2332; --border: #2d3748;
            --text: #e2e8f0; --muted: #718096; --accent: #4299e1;
            --green: #48bb78; --red: #fc8181; --yellow: #ffd666;
            --purple: #b794f4;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 30px 20px;
        }
        .container { max-width: 920px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2em; margin-bottom: 6px; }
        .subtitle { color: var(--muted); font-size: 14px; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 24px; margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px; font-weight: 600; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }

        /* Upload */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px;
            padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s;
        }
        .upload-zone:hover { border-color: var(--accent); }
        .upload-zone.dragover { border-color: var(--green); background: rgba(72,187,120,0.08); }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 36px; margin-bottom: 10px; }
        .upload-text { color: var(--muted); font-size: 14px; }
        .upload-formats { color: var(--muted); font-size: 12px; margin-top: 4px; }
        .file-list { margin-top: 12px; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: var(--bg); border-radius: 6px;
            margin-bottom: 6px; font-size: 13px;
        }
        .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .tag-ok { background: rgba(72,187,120,0.15); color: var(--green); }
        .tag-err { background: rgba(252,129,129,0.15); color: var(--red); }
        .tag-wait { background: rgba(66,153,225,0.15); color: var(--accent); }
        .stats { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .stat {
            background: var(--bg); padding: 8px 16px; border-radius: 6px;
            text-align: center; min-width: 80px;
        }
        .stat-val { font-size: 1.3em; font-weight: 700; color: var(--accent); }
        .stat-lab { font-size: 11px; color: var(--muted); }

        /* Strategy Selector */
        .strategy-bar {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
            align-items: center;
        }
        .strategy-label { color: var(--muted); font-size: 13px; margin-right: 4px; }
        .strategy-btn {
            padding: 8px 18px; border-radius: 20px; font-size: 13px;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
            border: 1px solid var(--border); background: transparent; color: var(--muted);
        }
        .strategy-btn:hover { border-color: var(--accent); color: var(--accent); }
        .strategy-btn.active-normal {
            background: rgba(66,153,225,0.15); border-color: var(--accent);
            color: var(--accent); font-weight: 600;
        }
        .strategy-btn.active-deep {
            background: rgba(183,148,244,0.15); border-color: var(--purple);
            color: var(--purple); font-weight: 600;
        }
        .strategy-btn.active-concise {
            background: rgba(72,187,120,0.15); border-color: var(--green);
            color: var(--green); font-weight: 600;
        }
        .strategy-desc {
            font-size: 12px; color: var(--muted); padding: 8px 14px;
            background: var(--bg); border-radius: 6px; margin-bottom: 14px;
        }

        /* Chat */
        .chat-area {
            min-height: 200px; max-height: 500px; overflow-y: auto;
            margin-bottom: 16px; padding: 8px 0;
        }
        .chat-msg { margin-bottom: 16px; display: flex; gap: 10px; }
        .chat-msg.user { flex-direction: row-reverse; }
        .chat-avatar {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .chat-msg.user .chat-avatar { background: rgba(66,153,225,0.15); }
        .chat-msg.assistant .chat-avatar { background: rgba(72,187,120,0.15); }
        .chat-bubble {
            max-width: 75%; padding: 12px 16px; border-radius: 12px;
            font-size: 14px; line-height: 1.7; white-space: pre-wrap;
        }
        .chat-msg.user .chat-bubble {
            background: rgba(66,153,225,0.12); border: 1px solid rgba(66,153,225,0.25);
            border-top-right-radius: 4px;
        }
        .chat-msg.assistant .chat-bubble {
            background: rgba(72,187,120,0.08); border: 1px solid rgba(72,187,120,0.2);
            border-top-left-radius: 4px;
        }
        .chat-meta {
            font-size: 11px; color: var(--muted); margin-top: 4px;
            display: flex; gap: 8px; align-items: center;
        }
        .chat-msg.user .chat-meta { justify-content: flex-end; }
        .strategy-tag {
            font-size: 10px; padding: 1px 6px; border-radius: 4px;
        }
        .strategy-tag-normal { background: rgba(66,153,225,0.15); color: var(--accent); }
        .strategy-tag-deep { background: rgba(183,148,244,0.15); color: var(--purple); }
        .strategy-tag-concise { background: rgba(72,187,120,0.15); color: var(--green); }

        .chat-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
        .chat-empty-icon { font-size: 48px; margin-bottom: 12px; }
        .chat-actions { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .btn-clear {
            background: transparent; border: 1px solid var(--border);
            color: var(--muted); padding: 6px 14px; border-radius: 6px;
            font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .btn-clear:hover { border-color: var(--red); color: var(--red); }

        /* Input */
        .input-row { display: flex; gap: 10px; }
        .input-row input {
            flex: 1; padding: 14px 18px; font-size: 15px;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text); outline: none;
            font-family: inherit;
        }
        .input-row input:focus { border-color: var(--accent); }
        .btn {
            padding: 14px 28px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { background: #444; cursor: not-allowed; transform: none; }
        .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 8px 14px; }
        .btn-danger:hover { background: rgba(252,129,129,0.1); }

        .examples { margin-top: 12px; }
        .examples span { color: var(--muted); font-size: 12px; }
        .exp-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--muted); padding: 4px 12px; border-radius: 14px;
            font-size: 12px; cursor: pointer; margin: 3px 3px 3px 0;
            font-family: inherit; transition: all 0.2s;
        }
        .exp-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* References */
        .ref-section { display: none; margin-top: 16px; }
        .ref-section.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .ref-toggle-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--muted); padding: 8px 16px; border-radius: 8px;
            font-size: 13px; cursor: pointer; width: 100%;
            margin-top: 12px; font-family: inherit; transition: all 0.2s;
        }
        .ref-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
        .ref-title { color: var(--muted); font-size: 12px; margin-bottom: 10px; letter-spacing: 1px; }
        .ref {
            background: var(--bg); border-radius: 8px; margin-bottom: 8px;
            border: 1px solid var(--border); overflow: hidden;
        }
        .ref-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; cursor: pointer; font-size: 13px;
        }
        .ref-head:hover { background: rgba(66,153,225,0.05); }
        .ref-head-left { display: flex; align-items: center; gap: 8px; }
        .ref-num {
            background: rgba(66,153,225,0.12); color: var(--accent);
            width: 22px; height: 22px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .ref-file { color: var(--muted); font-size: 11px; }
        .ref-score { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .score-hi { background: rgba(72,187,120,0.12); color: var(--green); }
        .score-md { background: rgba(255,214,102,0.12); color: var(--yellow); }
        .score-lo { background: rgba(252,129,129,0.12); color: var(--red); }
        .ref-body {
            display: none; padding: 12px 14px; border-top: 1px solid var(--border);
            font-size: 13px; line-height: 1.7; color: #a0aec0; white-space: pre-wrap;
        }
        .ref-body.open { display: block; }
        .ref-arrow { color: var(--muted); transition: transform 0.2s; font-size: 11px; }
        .ref-arrow.open { transform: rotate(180deg); }

        footer { text-align: center; margin-top: 36px; color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>&#x1F4DA; RAG 智能问答系统</h1>
        <p class="subtitle">多文件上传 &middot; 多轮对话 &middot; Prompt策略 &middot; Qwen-Plus</p>
    </header>

    <!-- Upload -->
    <div class="card">
        <div class="card-title">&#x1F4E4; 知识库管理</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-val" id="chunkCount">-</div>
                <div class="stat-lab">文档块</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="fileCount">-</div>
                <div class="stat-lab">已上传</div>
            </div>
            <div class="stat" style="display:flex;align-items:center;">
                <button class="btn btn-danger" onclick="clearUploads()">清空上传</button>
            </div>
        </div>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">&#x1F4C4;</div>
            <div class="upload-text">点击或拖拽文件上传</div>
            <div class="upload-formats">PDF / TXT / DOCX / MD</div>
            <input type="file" id="fileInput" multiple accept=".pdf,.txt,.docx,.md">
        </div>
        <div class="file-list" id="fileList"></div>
    </div>

    <!-- Chat -->
    <div class="card">
        <div class="card-title">&#x1F4AC; 智能对话</div>

        <!-- Strategy Selector -->
        <div class="strategy-bar">
            <span class="strategy-label">&#x1F3AF; Prompt策略：</span>
            <button class="strategy-btn active-normal" id="btn-normal" onclick="setStrategy('normal')">&#x1F4DD; 标准模式</button>
            <button class="strategy-btn" id="btn-deep" onclick="setStrategy('deep')">&#x1F50D; 深度分析</button>
            <button class="strategy-btn" id="btn-concise" onclick="setStrategy('concise')">&#x26A1; 简洁模式</button>
        </div>
        <div class="strategy-desc" id="strategyDesc">标准问答模式：基于文档内容给出清晰回答，适合一般性问题</div>

        <div class="chat-actions">
            <button class="btn-clear" onclick="clearChat()">&#x1F5D1; 清空对话</button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">&#x1F916;</div>
                <div>选择Prompt策略，开始提问</div>
                <div style="font-size:13px;margin-top:8px;color:var(--muted);">支持连续追问，可随时切换策略</div>
            </div>
        </div>

        <div class="input-row">
            <input type="text" id="question" placeholder="输入问题..."
                   onkeypress="if(event.keyCode===13)ask()">
            <button class="btn btn-primary" id="askBtn" onclick="ask()">发送</button>
        </div>

        <div class="examples">
            <span>&#x1F4A1;</span>
            <button class="exp-btn" onclick="setQ(this.textContent)">什么是商品？</button>
            <button class="exp-btn" onclick="setQ(this.textContent)">什么是剩余价值？</button>
            <button class="exp-btn" onclick="setQ(this.textContent)">货币如何转化为资本？</button>
        </div>

        <button class="ref-toggle-btn" id="refToggle" onclick="toggleRefs()" style="display:none;">
            &#x1F4D6; 查看参考段落
        </button>
        <div class="ref-section" id="refSection">
            <div class="ref-title">&#x1F4D6; 参考段落</div>
            <div id="refList"></div>
        </div>
    </div>

    <footer>RAG System &middot; ChromaDB + text2vec + Qwen-Plus &middot; Prompt Engineering</footer>
</div>

<script>
let currentStrategy = 'normal';

const strategyInfo = {
    normal:  {desc: '标准问答模式：基于文档内容给出清晰回答，适合一般性问题', color: 'var(--accent)'},
    deep:    {desc: '深度分析模式：分层论述 + 原文引用 + 总结，适合学术研究', color: 'var(--purple)'},
    concise: {desc: '简洁模式：100字以内直接回答，适合快速查询', color: 'var(--green)'}
};

loadStats();

function setStrategy(key) {
    currentStrategy = key;
    // update buttons
    document.querySelectorAll('.strategy-btn').forEach(b => {
        b.className = 'strategy-btn';
    });
    document.getElementById('btn-'+key).className = 'strategy-btn active-'+key;
    // update description
    document.getElementById('strategyDesc').textContent = strategyInfo[key].desc;
    document.getElementById('strategyDesc').style.borderLeft = '3px solid '+strategyInfo[key].color;
}

// Upload
const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));

async function loadStats() {
    try {
        const r = await fetch('/stats');
        const d = await r.json();
        document.getElementById('chunkCount').textContent = d.total_chunks;
        document.getElementById('fileCount').textContent = d.uploaded_files;
    } catch(e) {}
}

async function handleFiles(files) {
    const fd = new FormData();
    const fl = document.getElementById('fileList');
    fl.innerHTML = '';
    for (const f of files) {
        fd.append('files', f);
        fl.innerHTML += '<div class="file-item"><span>&#x1F4C4; '+f.name+'</span><span class="tag tag-wait">processing...</span></div>';
    }
    try {
        const r = await fetch('/upload', { method:'POST', body: fd });
        const d = await r.json();
        fl.innerHTML = '';
        for (const res of d.results) {
            if (res.status === 'success') {
                fl.innerHTML += '<div class="file-item"><span>&#x1F4C4; '+res.filename+'</span><span class="tag tag-ok">'+res.chunks+' chunks</span></div>';
            } else {
                fl.innerHTML += '<div class="file-item"><span>&#x1F4C4; '+res.filename+'</span><span class="tag tag-err">'+res.message+'</span></div>';
            }
        }
        document.getElementById('chunkCount').textContent = d.total_chunks;
        loadStats();
    } catch(e) { alert('Upload failed: '+e.message); }
}

function setQ(q) { document.getElementById('question').value = q; }

function addChatMsg(role, content, time, strategyUsed) {
    document.getElementById('chatEmpty').style.display = 'none';
    const area = document.getElementById('chatArea');
    const icon = role === 'user' ? '&#x1F464;' : '&#x1F916;';

    // strategy tag for assistant messages
    let tagHtml = '';
    if (role === 'assistant' && strategyUsed) {
        tagHtml = '<span class="strategy-tag strategy-tag-'+strategyUsed+'">'+strategyUsed+'</span>';
    }

    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.innerHTML = '<div class="chat-avatar">'+icon+'</div><div style="max-width:75%"><div class="chat-bubble">'+esc(content)+'</div><div class="chat-meta"><span>'+(time||'')+'</span>'+tagHtml+'</div></div>';
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
}

async function ask() {
    const q = document.getElementById('question').value.trim();
    if (!q) return;
    document.getElementById('question').value = '';
    const btn = document.getElementById('askBtn');
    btn.disabled = true;

    const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    addChatMsg('user', q, now, null);

    // typing indicator
    const typingId = 'typing-' + Date.now();
    const area = document.getElementById('chatArea');
    const td = document.createElement('div');
    td.id = typingId;
    td.className = 'chat-msg assistant';
    td.innerHTML = '<div class="chat-avatar">&#x1F916;</div><div><div class="chat-bubble" style="color:var(--muted);">&#x23F3; '+currentStrategy+' mode thinking...</div></div>';
    area.appendChild(td);
    area.scrollTop = area.scrollHeight;

    try {
        const r = await fetch('/ask', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({question: q, strategy: currentStrategy})
        });
        const d = await r.json();

        document.getElementById(typingId).remove();

        const answer = d.ai_answer || 'no answer available';
        addChatMsg('assistant', answer, now, d.strategy_used || currentStrategy);

        // references
        let refHtml = '';
        d.references.forEach((ref, i) => {
            let sc = ref.relevance >= 75 ? 'score-hi' : ref.relevance >= 60 ? 'score-md' : 'score-lo';
            refHtml += '<div class="ref"><div class="ref-head" onclick="toggleRef(this)"><div class="ref-head-left"><div class="ref-num">'+(i+1)+'</div><span class="ref-file">'+esc(ref.filename||'capital.txt')+'</span></div><div style="display:flex;align-items:center;gap:8px;"><span class="ref-score '+sc+'">'+ref.relevance+'%</span><span class="ref-arrow">&#x25BC;</span></div></div><div class="ref-body">'+esc(ref.content)+'</div></div>';
        });
        document.getElementById('refList').innerHTML = refHtml;
        document.getElementById('refToggle').style.display = 'block';

    } catch(e) {
        document.getElementById(typingId).remove();
        addChatMsg('assistant', 'Error: '+e.message, now, null);
    } finally {
        btn.disabled = false;
        document.getElementById('question').focus();
    }
}

async function clearChat() {
    await fetch('/clear_chat', {method:'POST'});
    const area = document.getElementById('chatArea');
    area.innerHTML = '<div class="chat-empty" id="chatEmpty"><div class="chat-empty-icon">&#x1F916;</div><div>cleared!</div></div>';
    document.getElementById('refToggle').style.display = 'none';
    document.getElementById('refSection').classList.remove('show');
}

function toggleRefs() { document.getElementById('refSection').classList.toggle('show'); }
function toggleRef(el) {
    el.nextElementSibling.classList.toggle('open');
    el.querySelector('.ref-arrow').classList.toggle('open');
}

async function clearUploads() {
    if (!confirm('clear uploaded files?')) return;
    await fetch('/clear_uploads', {method:'POST'});
    document.getElementById('fileList').innerHTML = '';
    loadStats();
}

function esc(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

document.getElementById('question').focus();
</script>
</body>
</html>
