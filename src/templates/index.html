<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资本论 RAG 问答系统</title>
    <style>
        :root {
            --bg-primary: #0f1923;
            --bg-secondary: #1a2634;
            --bg-card: #1e2d3d;
            --bg-input: #0d1520;
            --border: #2a3f5f;
            --border-hover: #4a9eff;
            --text-primary: #e8edf3;
            --text-secondary: #8899aa;
            --text-muted: #556677;
            --accent: #4a9eff;
            --accent-dark: #006eff;
            --accent-glow: rgba(74, 158, 255, 0.15);
            --green: #4ae9b0;
            --green-dark: #1a3a2e;
            --green-border: #2a5f4f;
            --yellow: #ffd666;
            --red: #ff6b6b;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* ========== Scrollbar ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ========== Layout ========== */
        .app {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ========== Header ========== */
        header {
            text-align: center;
            padding: 50px 0 40px;
            position: relative;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 12px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #94b8d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .tech-badges {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        /* ========== Search Box ========== */
        .search-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: border-color 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px 16px 48px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            padding: 16px 32px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(74, 158, 255, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #334;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ========== Example Questions ========== */
        .examples {
            margin-top: 18px;
        }

        .examples-label {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .examples-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-chip {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }

        .example-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
            transform: translateY(-1px);
        }

        /* ========== Loading ========== */
        .loading {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }

        .loading.show { display: block; }

        .loading-dots {
            display: inline-flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.32s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ========== Results ========== */
        .results {
            display: none;
            animation: fadeUp 0.4s ease;
        }

        .results.show { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Question Display */
        .q-card {
            background: var(--bg-card);
            padding: 18px 24px;
            border-radius: var(--radius-sm);
            margin-bottom: 22px;
            border-left: 4px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
        }

        .q-icon {
            background: var(--accent-glow);
            color: var(--accent);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .q-text {
            font-size: 16px;
            font-weight: 500;
        }

        /* ========== AI Answer ========== */
        .ai-card {
            background: linear-gradient(135deg, #162a22 0%, #1a2e2e 100%);
            border: 1px solid var(--green-border);
            border-radius: var(--radius);
            padding: 0;
            margin-bottom: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--green-border);
        }

        .ai-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--green) 0%, #2acf8f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .ai-title {
            font-weight: 600;
            color: var(--green);
            font-size: 14px;
        }

        .ai-model {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 3px 10px;
            border-radius: 12px;
        }

        .ai-body {
            padding: 24px;
            line-height: 1.9;
            color: #c8e0d8;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .ai-footer {
            padding: 12px 24px;
            border-top: 1px solid var(--green-border);
            display: flex;
            justify-content: flex-end;
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--green-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-copy:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .btn-copy.copied {
            border-color: var(--green);
            color: var(--green);
        }

        /* No AI Notice */
        .no-ai {
            background: #1e1e16;
            border: 1px solid #4a4a2a;
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-bottom: 24px;
            color: #b8b870;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ========== References ========== */
        .ref-section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .ref-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
            border: 1px solid var(--border);
            transition: all 0.25s;
            overflow: hidden;
        }

        .ref-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .ref-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(0,0,0,0.1);
            cursor: pointer;
            user-select: none;
        }

        .ref-header:hover {
            background: rgba(74, 158, 255, 0.05);
        }

        .ref-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ref-num {
            background: var(--accent-glow);
            color: var(--accent);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .ref-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .ref-relevance {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .relevance-high {
            background: rgba(74, 233, 176, 0.1);
            color: var(--green);
        }

        .relevance-medium {
            background: rgba(255, 214, 102, 0.1);
            color: var(--yellow);
        }

        .relevance-low {
            background: rgba(255, 107, 107, 0.1);
            color: var(--red);
        }

        .ref-body {
            padding: 18px 20px;
            line-height: 1.8;
            color: #b0bec5;
            font-size: 14px;
            white-space: pre-wrap;
            display: none;
            border-top: 1px solid var(--border);
        }

        .ref-body.open { display: block; }

        .ref-toggle {
            color: var(--text-muted);
            font-size: 18px;
            transition: transform 0.3s;
        }

        .ref-toggle.open {
            transform: rotate(180deg);
        }

        /* ========== Stats Bar ========== */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ========== Footer ========== */
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ========== Mobile ========== */
        @media (max-width: 640px) {
            .app { padding: 16px 12px 40px; }
            header { padding: 30px 0 24px; }
            h1 { font-size: 1.6em; }
            .logo { font-size: 36px; }
            .input-row { flex-direction: column; }
            .btn-primary { width: 100%; text-align: center; }
            .search-box { padding: 20px; }
            .stats-bar { gap: 10px; }
            .stat-item { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- Header -->
        <header>
            <div class="logo">&#x1F4DA;</div>
            <h1>资本论 RAG 问答系统</h1>
            <p class="subtitle">基于马克思《资本论》全三卷的智能检索与问答</p>
            <div class="tech-badges">
                <span class="badge">ChromaDB</span>
                <span class="badge">SentenceTransformers</span>
                <span class="badge">Qwen-Plus</span>
                <span class="badge">RAG</span>
            </div>
        </header>

        <!-- Search -->
        <div class="search-box">
            <div class="input-row">
                <div class="input-wrapper">
                    <span class="search-icon">&#x1F50D;</span>
                    <input
                        type="text"
                        id="question"
                        placeholder="请输入你关于《资本论》的问题..."
                        onkeypress="if(event.keyCode===13) askQuestion()"
                        autocomplete="off"
                    >
                </div>
                <button class="btn-primary" onclick="askQuestion()" id="askBtn">
                    提问
                </button>
            </div>

            <div class="examples">
                <div class="examples-label">&#x1F4A1; 试试这些问题</div>
                <div class="examples-grid">
                    <button class="example-chip" onclick="setQ(this.textContent)">什么是商品？</button>
                    <button class="example-chip" onclick="setQ(this.textContent)">什么是剩余价值？</button>
                    <button class="example-chip" onclick="setQ(this.textContent)">什么是资本的原始积累？</button>
                    <button class="example-chip" onclick="setQ(this.textContent)">货币如何转化为资本？</button>
                    <button class="example-chip" onclick="setQ(this.textContent)">什么是工作日？</button>
                    <button class="example-chip" onclick="setQ(this.textContent)">简单再生产是什么？</button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="loading-text">正在检索相关内容并生成回答...</div>
        </div>

        <!-- Results -->
        <div class="results" id="results">

            <!-- Question -->
            <div class="q-card">
                <div class="q-icon">Q</div>
                <div class="q-text" id="qDisplay"></div>
            </div>

            <!-- Stats -->
            <div class="stats-bar" id="statsBar"></div>

            <!-- AI Answer -->
            <div id="aiSection"></div>

            <!-- References -->
            <div class="ref-section-header">
                <span>&#x1F4D6;</span>
                <span>原文参考段落</span>
            </div>
            <div id="refList"></div>
        </div>

        <!-- Footer -->
        <footer>
            <p>RAG System &middot; ChromaDB + text2vec + Qwen-Plus</p>
            <p style="margin-top:6px;">
                Data source:
                <a href="https://www.marxists.org/chinese/marx/capital/" target="_blank">
                    marxists.org
                </a>
            </p>
        </footer>

    </div>

    <script>
    function setQ(q) {
        document.getElementById('question').value = q;
        askQuestion();
    }

    async function askQuestion() {
        const q = document.getElementById('question').value.trim();
        if (!q) return;

        const btn   = document.getElementById('askBtn');
        const load  = document.getElementById('loading');
        const res   = document.getElementById('results');

        btn.disabled = true;
        btn.textContent = '检索中...';
        load.classList.add('show');
        res.classList.remove('show');

        const t0 = Date.now();

        try {
            const resp = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q }),
            });
            const data = await resp.json();
            if (data.error) { alert(data.error); return; }

            const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

            // Question
            document.getElementById('qDisplay').textContent = data.question;

            // Stats
            const avgRel = data.references.reduce((s, r) => s + r.relevance, 0) / data.references.length;
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${data.references.length}</div>
                    <div class="stat-label">检索段落</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${avgRel.toFixed(1)}%</div>
                    <div class="stat-label">平均相关度</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${elapsed}s</div>
                    <div class="stat-label">响应时间</div>
                </div>
            `;

            // AI Answer
            const aiSec = document.getElementById('aiSection');
            if (data.ai_answer) {
                aiSec.innerHTML = `
                    <div class="ai-card">
                        <div class="ai-header">
                            <div class="ai-header-left">
                                <div class="ai-avatar">&#x1F916;</div>
                                <span class="ai-title">AI 回答</span>
                            </div>
                            <span class="ai-model">qwen-plus</span>
                        </div>
                        <div class="ai-body" id="aiBody">${esc(data.ai_answer)}</div>
                        <div class="ai-footer">
                            <button class="btn-copy" onclick="copyAI(this)">&#x1F4CB; 复制回答</button>
                        </div>
                    </div>
                `;
            } else {
                aiSec.innerHTML = `
                    <div class="no-ai">
                        <span>&#x1F4A1;</span>
                        <span>未配置大模型 API Key，当前仅显示检索到的原文段落。配置后可获得 AI 智能回答。</span>
                    </div>
                `;
            }

            // References
            let html = '';
            data.references.forEach((ref, i) => {
                let relClass = 'relevance-high';
                if (ref.relevance < 60) relClass = 'relevance-low';
                else if (ref.relevance < 75) relClass = 'relevance-medium';

                const isFirst = i === 0;
                html += `
                    <div class="ref-card">
                        <div class="ref-header" onclick="toggleRef(this)">
                            <div class="ref-header-left">
                                <div class="ref-num">${ref.id}</div>
                                <span class="ref-label">参考段落 ${ref.id}</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span class="ref-relevance ${relClass}">${ref.relevance}%</span>
                                <span class="ref-toggle ${isFirst ? 'open' : ''}">&#x25BC;</span>
                            </div>
                        </div>
                        <div class="ref-body ${isFirst ? 'open' : ''}">${esc(ref.content)}</div>
                    </div>
                `;
            });
            document.getElementById('refList').innerHTML = html;

            res.classList.add('show');

        } catch (e) {
            alert('Request failed: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '提问';
            load.classList.remove('show');
        }
    }

    function toggleRef(header) {
        const body   = header.nextElementSibling;
        const toggle = header.querySelector('.ref-toggle');
        body.classList.toggle('open');
        toggle.classList.toggle('open');
    }

    function copyAI(btn) {
        const text = document.getElementById('aiBody').textContent;
        navigator.clipboard.writeText(text).then(() => {
            btn.innerHTML = '&#x2705; 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = '&#x1F4CB; 复制回答';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    function esc(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // auto focus
    document.getElementById('question').focus();
    </script>
</body>
</html>
